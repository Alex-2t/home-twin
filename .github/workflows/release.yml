# Release: when a GitHub release is published (tag v0.1.0), build the editor, set the version number in manifest.json and attach
# home_twin.zip (the contents of custom_components/home_twin including frontend/panel.js). HACS downloads it (hacs.json: zip_release).
name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Build and test the editor
        working-directory: editor
        run: npm ci && npm run build && npm test
      - name: Version from the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version=$v' custom_components/home_twin/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/home_twin/manifest.json
      - name: Pack
        working-directory: custom_components/home_twin
        run: zip -r "$GITHUB_WORKSPACE/home_twin.zip" . -x '__pycache__/*' '*.pyc'
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" home_twin.zip --clobber
