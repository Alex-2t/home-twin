# Checks: hassfest (the integration as HA itself validates it), HACS (whether the repository is fit for the catalog — public repos only),
# the editor builds and the tests pass, no Cyrillic anywhere in the repository (English only; Russian lives in ru.json).
name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Build and test
        working-directory: editor
        run: npm ci && npm run build && npm test
      - name: English only
        working-directory: editor
        run: node tools/no-cyrillic.mjs
